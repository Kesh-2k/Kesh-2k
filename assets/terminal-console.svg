<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330">
<style>
.f{font:15px 'Courier New',monospace}
.l{opacity:0;animation:in .4s ease-out forwards}
.k{fill:#34d399}.v{fill:#e2e8f0}.g{fill:#22d3ee}.m{fill:#64748b}.y{fill:#4ade80}
.cur{animation:bl 1s steps(1) infinite}
.win{animation:pop .8s ease-out both}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes bl{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
</style>
<defs><linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/></linearGradient></defs>
<g class="win" style="transform-origin:center">
<rect x="2" y="2" width="996" height="326" rx="16" fill="#0a0d12" stroke="url(#b)" stroke-width="2"/>
<rect x="2" y="2" width="996" height="40" rx="16" fill="#10151c"/><rect x="2" y="26" width="996" height="16" fill="#10151c"/>
<circle cx="28" cy="22" r="6" fill="#ff5f57"/><circle cx="48" cy="22" r="6" fill="#febc2e"/><circle cx="68" cy="22" r="6" fill="#28c840"/>
<text x="500" y="27" text-anchor="middle" class="f m">kesh@hub: ~/sobre-mim</text>
</g>
<g class="f">
<text class="l" x="28" y="78" style="animation-delay:.6s"><tspan class="y">➜</tspan> <tspan class="g">~</tspan> <tspan class="v">cat sobre-mim.ts</tspan></text>
<text class="l" x="28" y="110" style="animation-delay:1.1s"><tspan class="k">const</tspan> <tspan class="v">jeferson = {</tspan></text>
<text class="l" x="56" y="136" style="animation-delay:1.5s"><tspan class="g">foco</tspan><tspan class="v">:      </tspan><tspan class="y">"produtos web de ponta a ponta + a plataforma que os mantém no ar"</tspan><tspan class="v">,</tspan></text>
<text class="l" x="56" y="162" style="animation-delay:1.9s"><tspan class="g">backend</tspan><tspan class="v">:   [</tspan><tspan class="y">"Node"</tspan><tspan class="v">, </tspan><tspan class="y">"TypeScript"</tspan><tspan class="v">, </tspan><tspan class="y">"Python"</tspan><tspan class="v">, </tspan><tspan class="y">"PostgreSQL"</tspan><tspan class="v">],</tspan></text>
<text class="l" x="56" y="188" style="animation-delay:2.3s"><tspan class="g">frontend</tspan><tspan class="v">:  [</tspan><tspan class="y">"React"</tspan><tspan class="v">, </tspan><tspan class="y">"Vite"</tspan><tspan class="v">, </tspan><tspan class="y">"Tailwind"</tspan><tspan class="v">, </tspan><tspan class="y">"SAP Fiori"</tspan><tspan class="v">],</tspan></text>
<text class="l" x="56" y="214" style="animation-delay:2.7s"><tspan class="g">infra</tspan><tspan class="v">:     [</tspan><tspan class="y">"Docker"</tspan><tspan class="v">, </tspan><tspan class="y">"Traefik"</tspan><tspan class="v">, </tspan><tspan class="y">"Cloudflare"</tspan><tspan class="v">, </tspan><tspan class="y">"AWS"</tspan><tspan class="v">, </tspan><tspan class="y">"GitHub Actions"</tspan><tspan class="v">],</tspan></text>
<text class="l" x="56" y="240" style="animation-delay:3.1s"><tspan class="g">obsessão</tspan><tspan class="v">:  [</tspan><tspan class="y">"confiabilidade"</tspan><tspan class="v">, </tspan><tspan class="y">"segurança"</tspan><tspan class="v">, </tspan><tspan class="y">"automação"</tspan><tspan class="v">],</tspan></text>
<text class="l" x="56" y="266" style="animation-delay:3.5s"><tspan class="g">agora</tspan><tspan class="v">:     </tspan><tspan class="y">"agentes de IA operando servidores em produção"</tspan><tspan class="v">,</tspan></text>
<text class="l" x="28" y="292" style="animation-delay:3.9s"><tspan class="v">};</tspan></text>
<text class="l" x="28" y="318" style="animation-delay:4.3s"><tspan class="y">➜</tspan> <tspan class="g">~</tspan> <tspan class="v cur">▋</tspan></text>
</g>
</svg>
