<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210">
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="480" height="210" rx="18"/></clipPath></defs>
<style>
.w{opacity:0;animation:in .9s 0.00s cubic-bezier(.2,.8,.2,1) forwards}
.h{font:700 22px 'Segoe UI',Ubuntu,sans-serif;fill:#f1f5f9}
.p{font:400 14.5px 'Segoe UI',Ubuntu,sans-serif;fill:#94a3b8}
.tg{font:600 12px 'Segoe UI',Ubuntu,sans-serif;fill:#e2e8f0}
.e{font-size:26px;animation:bob 3s ease-in-out infinite}
.s{animation:sw 5s 0.0s ease-in-out infinite}
.pl{animation:pu 2.4s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes sw{0%{transform:translateX(-500px)}60%,100%{transform:translateX(500px)}}
@keyframes pu{50%{opacity:.25}}
</style>
<g class="w"><g clip-path="url(#c)">
<rect width="480" height="210" fill="#0d1117"/><rect width="480" height="210" fill="url(#b)" opacity=".22"/>
<rect class="s" width="240" height="210" fill="url(#sh)" transform="skewX(-20)"/>
</g>
<rect x="1" y="1" width="478" height="208" rx="18" fill="none" stroke="#7c3aed" stroke-opacity=".55"/>
<text x="24" y="52" class="e">🖥️</text><text x="66" y="50" class="h">Central Apps Hub</text>
<circle class="pl" cx="452" cy="32" r="5" fill="#4ade80"/>
<text x="24" y="90" class="p">Painel que gerencia um servidor Linux inteiro:</text><text x="24" y="112" class="p">deploy em Docker, rotas, terminal, cofre e</text><text x="24" y="134" class="p">monitoramento em tempo real.</text>
<rect x="24" y="160" width="54" height="26" rx="13" fill="#7c3aed" fill-opacity=".18" stroke="#7c3aed" stroke-opacity=".6"/><text x="51.0" y="178" text-anchor="middle" class="tg">Node</text><rect x="86" y="160" width="62" height="26" rx="13" fill="#7c3aed" fill-opacity=".18" stroke="#7c3aed" stroke-opacity=".6"/><text x="117.0" y="178" text-anchor="middle" class="tg">React</text><rect x="156" y="160" width="86" height="26" rx="13" fill="#7c3aed" fill-opacity=".18" stroke="#7c3aed" stroke-opacity=".6"/><text x="199.0" y="178" text-anchor="middle" class="tg">Postgres</text><rect x="250" y="160" width="78" height="26" rx="13" fill="#7c3aed" fill-opacity=".18" stroke="#7c3aed" stroke-opacity=".6"/><text x="289.0" y="178" text-anchor="middle" class="tg">Traefik</text></g></svg>