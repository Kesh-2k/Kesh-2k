<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d12"/><stop offset="1" stop-color="#0d1218"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#10b981" stop-opacity=".55"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#06b6d4" stop-opacity=".45"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#10b981" stroke-opacity=".08"/></pattern>
<clipPath id="r"><rect width="1000" height="300" rx="22"/></clipPath>
</defs>
<style>
.t{font:800 84px 'Segoe UI',Ubuntu,Helvetica,sans-serif;opacity:0;animation:up 1.2s .2s ease-out forwards}
.s{font:500 22px 'Segoe UI',Ubuntu,Helvetica,sans-serif;fill:#cbd5e1;letter-spacing:6px;opacity:0;animation:up 1.2s .8s ease-out forwards}
.c{font:600 15px 'Courier New',monospace;fill:#22d3ee;opacity:0;animation:up 1s 1.4s ease-out forwards}
.p{fill:#fff;animation:tw 3s ease-in-out infinite}
.o{animation:fl 12s ease-in-out infinite alternate}
.ln{stroke-dasharray:420;stroke-dashoffset:420;animation:dr 1.6s 1s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes fl{to{transform:translate(60px,-30px)}}
@keyframes dr{to{stroke-dashoffset:0}}
</style>
<g clip-path="url(#r)">
<rect width="1000" height="300" fill="url(#bg)"/><rect width="1000" height="300" fill="url(#grid)"/>
<circle class="o" cx="180" cy="90" r="220" fill="url(#o1)"/>
<circle class="o" cx="850" cy="240" r="240" fill="url(#o2)" style="animation-duration:15s;animation-direction:alternate-reverse"/>
<g>
<circle class="p" cx="90" cy="250" r="1.6"/><circle class="p" cx="260" cy="40" r="1.2" style="animation-delay:.6s"/><circle class="p" cx="420" cy="270" r="1.4" style="animation-delay:1.2s"/>
<circle class="p" cx="610" cy="35" r="1.8" style="animation-delay:.3s"/><circle class="p" cx="760" cy="80" r="1.2" style="animation-delay:1.8s"/><circle class="p" cx="930" cy="40" r="1.5" style="animation-delay:.9s"/>
<circle class="p" cx="960" cy="200" r="1.2" style="animation-delay:2.2s"/><circle class="p" cx="40" cy="70" r="1.3" style="animation-delay:1.5s"/><circle class="p" cx="520" cy="60" r="1" style="animation-delay:2.6s"/>
</g>
<text class="t" x="500" y="135" text-anchor="middle" fill="url(#tx)" filter="url(#glow)">Kesh</text>
<line class="ln" x1="400" y1="160" x2="600" y2="160" stroke="url(#tx)" stroke-width="2" stroke-linecap="round"/>
<text class="s" x="500" y="200" text-anchor="middle">FULL-STACK · DEVOPS · PLATFORM</text>
<text class="c" x="500" y="245" text-anchor="middle">$ deploy --prod --zero-downtime ✓</text>
</g>
</svg>
