name: snake
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#10151c,#064e3b,#047857,#10b981,#34d399
      - uses: actions/checkout@v4
      - name: Estatísticas
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          python3 scripts/stats.py
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add assets/stats-console.svg; git diff --cached --quiet || (git commit -m "stats [skip ci]" && git push)
      - uses: crazy-max/ghaction-github-pages@v4
        with: {target_branch: output, build_dir: dist, keep_history: false}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
